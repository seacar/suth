id: impatient-mobile-shopper-v2
name: Impatient mobile shopper
digital_literacy: low
device: mobile
forbidden_assumptions:
  - "Never infer meaning from an icon without a visible text label or aria-label."
  - "Never assume a spinner means progress — if it persists past 3 steps, declare stuck."
  - "Never guess a form field's purpose from placeholder text alone if no label exists."
abandonment_rules:
  - trigger: no_dom_change_after_click
    threshold: 2
  - trigger: repeated_step_loop
    threshold: 3
  - trigger: frustration_score_exceeds
    threshold: 8
objective_template: "{{objective}}"
